<svg width="726" height="396" viewBox="0 0 726 396"
     xmlns="http://www.w3.org/2000/svg" role="img" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <title>Diagrama de McKelvey</title>
  <defs>
    <marker id="seta" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#000000"/>
    </marker>
    <marker id="seta-apagada" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c8d0d8"/>
    </marker>
    <marker id="seta-dano" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0070C0"/>
    </marker>
  </defs>
  <text x="363.0" y="17.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">Diagrama de McKelvey</text>
  <rect x="120" y="64" width="300" height="106" fill="#9CCB9E" fill-opacity="0.85"/>
  <rect x="120" y="64" width="560" height="236" fill="none" stroke="#000000" stroke-width="1.6"/>
  <line x1="420" y1="64" x2="420" y2="300" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <line x1="120" y1="170" x2="680" y2="170" stroke="#000000" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="270.0" y="54.0" font-size="19" fill="#000000" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">identificados</text>
  <text x="550.0" y="54.0" font-size="19" fill="#000000" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">não descobertos</text>
  <text x="110.0" y="123.0" font-size="19" fill="#000000" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">econômicos</text>
  <text x="110.0" y="231.0" font-size="19" fill="#000000" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">sub-</text>
  <text x="110.0" y="253.0" font-size="19" fill="#000000" text-anchor="end" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">econômicos</text>
  <text x="270.0" y="113.0" font-size="19" fill="#1B5E20" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">RESERVAS ATUAIS</text>
  <text x="270.0" y="137.0" font-size="15" fill="#1B5E20" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">lucrativas aos preços atuais</text>
  <text x="550.0" y="231.0" font-size="15" fill="#8a94a0" text-anchor="middle" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">dotação: o retângulo todo,</text>
  <text x="550.0" y="253.0" font-size="15" fill="#8a94a0" text-anchor="middle" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">conceito geológico</text>
  <line x1="210.0" y1="156.0" x2="210.0" y2="214.0" stroke="#1b3a5c" stroke-width="3"/>
  <path d="M 210.0 226.0 L 203.0 214.0 L 217.0 214.0 Z" fill="#1b3a5c"/>
  <text x="222.0" y="200.0" font-size="15" fill="#1b3a5c" text-anchor="start" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">preço maior,</text>
  <text x="222.0" y="220.0" font-size="15" fill="#1b3a5c" text-anchor="start" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">tecnologia</text>
  <line x1="404.0" y1="94.0" x2="482.0" y2="94.0" stroke="#1b3a5c" stroke-width="3"/>
  <path d="M 494.0 94.0 L 482.0 101.0 L 482.0 87.0 Z" fill="#1b3a5c"/>
  <text x="500.0" y="100.0" font-size="15" fill="#1b3a5c" text-anchor="start" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">exploração</text>
  <text x="120.0" y="324.0" font-size="15" fill="#8a94a0" text-anchor="start" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">certeza geológica decrescente →</text>
  <text x="363.0" y="356.0" font-size="17" fill="#1b3a5c" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">a fronteira das reservas atuais se move com o preço,</text>
  <text x="363.0" y="376.0" font-size="17" fill="#1b3a5c" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">a tecnologia e a exploração; a dotação total não</text>
</svg>

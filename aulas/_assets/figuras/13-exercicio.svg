<svg width="726" height="406" viewBox="0 0 726 406"
     xmlns="http://www.w3.org/2000/svg" role="img" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <title>Exercício: recurso parcialmente renovável</title>
  <defs>
    <marker id="seta" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#000000"/>
    </marker>
    <marker id="seta-apagada" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c8d0d8"/>
    </marker>
    <marker id="seta-dano" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0070C0"/>
    </marker>
  </defs>
  <text x="350.0" y="17.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">Recurso parcialmente renovável: s = r = 0,1</text>
  <line x1="58.0" y1="292.0" x2="58.0" y2="46.0" stroke="#000000" stroke-width="1.2" marker-end="url(#seta)"/>
  <line x1="626.0" y1="292.0" x2="626.0" y2="46.0" stroke="#000000" stroke-width="1.2" marker-end="url(#seta)"/>
  <line x1="58.0" y1="292.0" x2="626.0" y2="292.0" stroke="#000000" stroke-width="1.2"/>
  <text x="66.0" y="46.0" font-size="19" fill="#000000" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">benefício marginal líquido (VP)</text>
  <text x="48.0" y="312.0" font-size="15" fill="#2E7D32" text-anchor="end" font-style="italic" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">q₁ →</text>
  <text x="638.0" y="332.0" font-size="15" fill="#C26A00" text-anchor="start" font-style="italic" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">← q₂</text>
  <line x1="58.0" y1="88.0" x2="463.7" y2="292.0" stroke="#2E7D32" stroke-width="2.8"/>
  <text x="50.0" y="93.0" font-size="15" fill="#000000" text-anchor="end" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">6</text>
  <text x="117.5" y="101.6" font-size="15" fill="#2E7D32" text-anchor="start" font-style="italic" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">BMgL₁</text>
  <line x1="257.2" y1="292.0" x2="626.0" y2="88.0" stroke="#C26A00" stroke-width="2.8"/>
  <text x="634.0" y="93.0" font-size="15" fill="#C26A00" text-anchor="start" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">6</text>
  <text x="615.2" y="79.5" font-size="15" fill="#C26A00" text-anchor="end" font-style="italic" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">BMgL₂ × (1+s)/(1+r)</text>
  <line x1="58.0" y1="237.6" x2="355.5" y2="237.6" stroke="#1b3a5c" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="355.5" y1="292.0" x2="355.5" y2="237.6" stroke="#1b3a5c" stroke-width="1.1" stroke-dasharray="4 3"/>
  <circle cx="355.5" cy="237.6" r="6" fill="#1b3a5c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="50.0" y="242.6" font-size="15" fill="#1b3a5c" text-anchor="end" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">1,6</text>
  <text x="355.5" y="312.0" font-size="15" fill="#2E7D32" text-anchor="middle" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">11</text>
  <text x="355.5" y="332.0" font-size="15" fill="#C26A00" text-anchor="middle" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">11</text>
  <text x="363.0" y="366.0" font-size="17" fill="#1b3a5c" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">o crescimento do estoque compensa o desconto: q₁* =</text>
  <text x="363.0" y="386.0" font-size="17" fill="#1b3a5c" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">q₂* = 11, e as duas curvas valem 6 na primeira unidade</text>
</svg>

  <text x="63.51" y="344.52" font-size="14" fill="#000000" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">pᵧ &lt; 0  →  reta sobe, melhor para sudeste</text>

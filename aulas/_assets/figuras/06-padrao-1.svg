  <text x="660.0" y="15.0" font-size="14" fill="#000000" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">Firma 2 (custo baixo)</text>

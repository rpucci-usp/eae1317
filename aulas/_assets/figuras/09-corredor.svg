<svg width="780" height="376" viewBox="0 0 780 376"
     xmlns="http://www.w3.org/2000/svg" role="img" font-family="Source Sans Pro, Helvetica, Arial, sans-serif">
  <title>A oferta efetiva do instrumento híbrido</title>
  <defs>
    <marker id="seta" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#000000"/>
    </marker>
    <marker id="seta-apagada" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c8d0d8"/>
    </marker>
    <marker id="seta-dano" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#0070C0"/>
    </marker>
  </defs>
  <text x="380.0" y="17.0" font-size="18" fill="#000000" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">A oferta efetiva de permissões</text>
  <line x1="58.0" y1="282.0" x2="58.0" y2="46.0" stroke="#000000" stroke-width="1.2" marker-end="url(#seta)"/>
  <line x1="58.0" y1="282.0" x2="742.0" y2="282.0" stroke="#000000" stroke-width="1.2" marker-end="url(#seta)"/>
  <text x="750.0" y="288.0" font-size="19" fill="#000000" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">E</text>
  <text x="66.0" y="46.0" font-size="19" fill="#000000" text-anchor="start" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">R$ por tonelada</text>
  <line x1="58.0" y1="239.2" x2="451.0" y2="239.2" stroke="#1b3a5c" stroke-width="2.6"/>
  <line x1="451.0" y1="239.2" x2="451.0" y2="182.2" stroke="#1b3a5c" stroke-width="2.6"/>
  <line x1="451.0" y1="182.2" x2="734.0" y2="182.2" stroke="#1b3a5c" stroke-width="2.6"/>
  <text x="50.0" y="244.2" font-size="15" fill="#1b3a5c" text-anchor="end" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">ψ = 15</text>
  <text x="50.0" y="187.2" font-size="15" fill="#1b3a5c" text-anchor="end" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">τ = 35</text>
  <text x="451.0" y="302.0" font-size="15" fill="#1b3a5c" text-anchor="middle" font-style="italic" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">L = 125</text>
  <line x1="58.0" y1="92.0" x2="686.7" y2="282.0" stroke="#C00000" stroke-width="2.2"/>
  <text x="108.3" y="90.1" font-size="15" fill="#C00000" text-anchor="start" font-style="italic" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">−C′(E)</text>
  <circle cx="451.0" cy="210.8" r="4.5" fill="#1b3a5c" stroke="#ffffff" stroke-width="1.5"/>
  <text x="254.5" y="273.4" font-size="15" fill="#1b3a5c" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">aqui a firma recebe subsídio</text>
  <text x="592.5" y="153.8" font-size="15" fill="#1b3a5c" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">aqui a firma paga imposto</text>
  <text x="380.0" y="362.0" font-size="17" fill="#1b3a5c" text-anchor="middle" font-weight="600" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" paint-order="stroke">o preço da permissão fica preso entre ψ e τ: ψ ≤ σ ≤ τ</text>
